<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 i {
            color: #27ae60;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #ecf0f1;
        }

        .card-header h3 {
            color: #2c3e50;
            font-size: 1.2rem;
        }

        .card-header i {
            color: #3498db;
            font-size: 1.5rem;
        }

        .stat-card {
            text-align: center;
            padding: 2rem 1rem;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-container {
            height: 300px;
            position: relative;
        }

        .detection-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .detection-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #27ae60;
            transition: background 0.3s ease;
        }

        .detection-item:hover {
            background: #e9ecef;
        }

        .detection-icon {
            width: 40px;
            height: 40px;
            background: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .detection-info {
            flex: 1;
        }

        .detection-species {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.2rem;
        }

        .detection-meta {
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        .confidence-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }

        .confidence-high { background: #27ae60; }
        .confidence-medium { background: #f39c12; }
        .confidence-low { background: #e74c3c; }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .device-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            border-left: 4px solid #3498db;
        }

        .device-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-online { background: #27ae60; }
        .status-offline { background: #e74c3c; }

        .device-name {
            font-weight: bold;
            color: #2c3e50;
        }

        .device-location {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.3s ease;
        }

        .refresh-btn:hover {
            background: #2980b9;
        }

        .refresh-btn i {
            transition: transform 0.3s ease;
        }

        .refresh-btn.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }

        .loading i {
            animation: spin 1s linear infinite;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .header {
                padding: 1rem;
            }
            
            .stat-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>
            <i class="fas fa-binoculars"></i>
            Wildlife Monitoring Dashboard
        </h1>
        <button class="refresh-btn" onclick="refreshDashboard()">
            <i class="fas fa-sync-alt"></i>
            Refresh
        </button>
    </header>

    <div class="container">
        <!-- Statistics Cards -->
        <div class="dashboard-grid">
            <div class="card stat-card">
                <div class="stat-number" id="total-detections">0</div>
                <div class="stat-label">Total Detections</div>
            </div>
            
            <div class="card stat-card">
                <div class="stat-number" id="recent-detections">0</div>
                <div class="stat-label">Last 24 Hours</div>
            </div>
            
            <div class="card stat-card">
                <div class="stat-number" id="active-devices">0</div>
                <div class="stat-label">Active Devices</div>
            </div>
            
            <div class="card stat-card">
                <div class="stat-number" id="species-count">0</div>
                <div class="stat-label">Species Detected</div>
            </div>
        </div>

        <!-- Charts and Data -->
        <div class="dashboard-grid">
            <!-- Species Distribution Chart -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-chart-pie"></i>
                    <h3>Species Distribution</h3>
                </div>
                <div class="chart-container">
                    <canvas id="species-chart"></canvas>
                </div>
            </div>

            <!-- Detection Timeline -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-chart-line"></i>
                    <h3>Detection Timeline</h3>
                </div>
                <div class="chart-container">
                    <canvas id="timeline-chart"></canvas>
                </div>
            </div>

            <!-- Recent Detections -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-list"></i>
                    <h3>Recent Detections</h3>
                </div>
                <div class="detection-list" id="recent-detections-list">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <div>Loading detections...</div>
                    </div>
                </div>
            </div>

            <!-- Device Status -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-camera"></i>
                    <h3>Device Status</h3>
                </div>
                <div class="device-grid" id="device-status">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <div>Loading devices...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts Section -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>System Alerts</h3>
            </div>
            <div id="alerts-container">
                <!-- Alerts will be populated here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let speciesChart = null;
        let timelineChart = null;
        let refreshInterval = null;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            initializeDashboard();
            startAutoRefresh();
        });

        function initializeDashboard() {
            loadStatistics();
            loadRecentDetections();
            loadDeviceStatus();
            initializeCharts();
        }

        function startAutoRefresh() {
            // Refresh every 30 seconds
            refreshInterval = setInterval(refreshDashboard, 30000);
        }

        function refreshDashboard() {
            const refreshBtn = document.querySelector('.refresh-btn');
            refreshBtn.classList.add('loading');
            
            loadStatistics();
            loadRecentDetections();
            loadDeviceStatus();
            updateCharts();
            
            setTimeout(() => {
                refreshBtn.classList.remove('loading');
            }, 1000);
        }

        async function loadStatistics() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                document.getElementById('total-detections').textContent = stats.total_detections || 0;
                document.getElementById('recent-detections').textContent = stats.recent_detections || 0;
                document.getElementById('active-devices').textContent = stats.active_devices || 0;
                document.getElementById('species-count').textContent = stats.species_stats?.length || 0;
                
                // Update species chart
                if (speciesChart && stats.species_stats) {
                    updateSpeciesChart(stats.species_stats);
                }
                
            } catch (error) {
                console.error('Error loading statistics:', error);
                showAlert('Error loading statistics', 'danger');
            }
        }

        async function loadRecentDetections() {
            try {
                const response = await fetch('/api/detections');
                const data = await response.json();
                const detections = data.detections || [];
                
                const container = document.getElementById('recent-detections-list');
                
                if (detections.length === 0) {
                    container.innerHTML = '<div class="alert alert-info">No recent detections found.</div>';
                    return;
                }
                
                container.innerHTML = detections.slice(0, 10).map(detection => `
                    <div class="detection-item">
                        <div class="detection-icon">
                            <i class="fas fa-paw"></i>
                        </div>
                        <div class="detection-info">
                            <div class="detection-species">${detection.species}</div>
                            <div class="detection-meta">
                                Device: ${detection.device_id} | 
                                ${formatDateTime(detection.timestamp)}
                            </div>
                        </div>
                        <div class="confidence-badge ${getConfidenceClass(detection.confidence)}">
                            ${Math.round(detection.confidence * 100)}%
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading detections:', error);
                document.getElementById('recent-detections-list').innerHTML = 
                    '<div class="alert alert-danger">Error loading detections</div>';
            }
        }

        async function loadDeviceStatus() {
            try {
                const response = await fetch('/api/devices');
                const data = await response.json();
                const devices = data.devices || [];
                
                const container = document.getElementById('device-status');
                
                if (devices.length === 0) {
                    container.innerHTML = '<div class="alert alert-info">No devices registered.</div>';
                    return;
                }
                
                container.innerHTML = devices.map(device => `
                    <div class="device-card">
                        <div class="device-status">
                            <div class="status-dot ${getDeviceStatusClass(device)}"></div>
                            <div class="device-name">${device.name}</div>
                        </div>
                        <div class="device-location">${device.location || 'Unknown location'}</div>
                        <div class="device-meta">
                            Last seen: ${formatDateTime(device.last_heartbeat)}
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading device status:', error);
                document.getElementById('device-status').innerHTML = 
                    '<div class="alert alert-danger">Error loading device status</div>';
            }
        }

        function initializeCharts() {
            // Initialize species chart
            const speciesCtx = document.getElementById('species-chart').getContext('2d');
            speciesChart = new Chart(speciesCtx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                            '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            // Initialize timeline chart
            const timelineCtx = document.getElementById('timeline-chart').getContext('2d');
            timelineChart = new Chart(timelineCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Detections',
                        data: [],
                        borderColor: '#36A2EB',
                        backgroundColor: 'rgba(54, 162, 235, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateSpeciesChart(speciesStats) {
            if (!speciesChart || !speciesStats.length) return;
            
            const labels = speciesStats.map(stat => stat.species);
            const data = speciesStats.map(stat => stat.count);
            
            speciesChart.data.labels = labels;
            speciesChart.data.datasets[0].data = data;
            speciesChart.update();
        }

        function updateCharts() {
            // This would update charts with fresh data
            // Implementation depends on specific requirements
        }

        function getConfidenceClass(confidence) {
            if (confidence >= 0.8) return 'confidence-high';
            if (confidence >= 0.6) return 'confidence-medium';
            return 'confidence-low';
        }

        function getDeviceStatusClass(device) {
            const lastHeartbeat = new Date(device.last_heartbeat);
            const now = new Date();
            const timeDiff = now - lastHeartbeat;
            
            // Consider device offline if no heartbeat for 5 minutes
            return timeDiff < 5 * 60 * 1000 ? 'status-online' : 'status-offline';
        }

        function formatDateTime(dateString) {
            if (!dateString) return 'Unknown';
            
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} minutes ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} hours ago`;
            
            return date.toLocaleString();
        }

        function showAlert(message, type = 'info') {
            const alertsContainer = document.getElementById('alerts-container');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas fa-info-circle"></i>
                ${message}
            `;
            
            alertsContainer.appendChild(alertDiv);
            
            // Remove alert after 5 seconds
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>

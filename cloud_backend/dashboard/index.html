<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Monitoring Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-label {
            font-weight: 500;
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
        }

        .detection-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .detection-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .detection-species {
            font-weight: bold;
            color: #667eea;
        }

        .detection-confidence {
            color: #28a745;
            font-weight: 500;
        }

        .detection-time {
            color: #666;
            font-size: 0.9rem;
        }

        .device-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-active {
            background: #28a745;
        }

        .status-inactive {
            background: #dc3545;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .refresh-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: rotate(180deg);
            background: white;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦌 Wildlife Monitoring Dashboard</h1>
            <p>Real-time wildlife detection and monitoring system</p>
        </div>

        <button class="refresh-btn" onclick="refreshData()">🔄</button>

        <div id="error-container"></div>

        <div class="dashboard-grid">
            <!-- System Overview -->
            <div class="card">
                <h3>📊 System Overview</h3>
                <div id="system-stats">
                    <div class="loading">Loading system statistics...</div>
                </div>
            </div>

            <!-- Recent Detections -->
            <div class="card">
                <h3>🦊 Recent Detections</h3>
                <div id="recent-detections">
                    <div class="loading">Loading recent detections...</div>
                </div>
            </div>

            <!-- Device Status -->
            <div class="card">
                <h3>📡 Device Status</h3>
                <div id="device-status">
                    <div class="loading">Loading device status...</div>
                </div>
            </div>

            <!-- Species Distribution -->
            <div class="card">
                <h3>📈 Species Distribution</h3>
                <div id="species-stats">
                    <div class="loading">Loading species statistics...</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="exportData()">📥 Export Data</button>
            <button class="btn btn-secondary" onclick="viewLogs()">📋 View Logs</button>
            <button class="btn btn-secondary" onclick="systemHealth()">🏥 System Health</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            refreshData();
        });

        async function refreshData() {
            try {
                await Promise.all([
                    loadSystemStats(),
                    loadRecentDetections(),
                    loadDeviceStatus(),
                    loadSpeciesStats()
                ]);
            } catch (error) {
                showError('Failed to refresh data: ' + error.message);
            }
        }

        async function loadSystemStats() {
            try {
                const response = await fetch(`${API_BASE}/stats/detections?days=7`);
                const data = await response.json();
                
                const statsHtml = `
                    <div class="stat">
                        <span class="stat-label">Total Detections (7 days)</span>
                        <span class="stat-value">${data.total_detections || 0}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Active Devices</span>
                        <span class="stat-value">${Object.keys(data.device_counts || {}).length}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Species Detected</span>
                        <span class="stat-value">${Object.keys(data.species_counts || {}).length}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Date Range</span>
                        <span class="stat-value">${data.date_range_days || 7} days</span>
                    </div>
                `;
                
                document.getElementById('system-stats').innerHTML = statsHtml;
            } catch (error) {
                document.getElementById('system-stats').innerHTML = '<div class="error">Failed to load system stats</div>';
            }
        }

        async function loadRecentDetections() {
            try {
                const response = await fetch(`${API_BASE}/detections?limit=10`);
                const data = await response.json();
                
                if (data.detections && data.detections.length > 0) {
                    const detectionsHtml = data.detections.map(detection => `
                        <div class="detection-item">
                            <div>
                                <div class="detection-species">${detection.species}</div>
                                <div class="detection-time">${new Date(detection.timestamp).toLocaleString()}</div>
                            </div>
                            <div class="detection-confidence">${(detection.confidence * 100).toFixed(1)}%</div>
                        </div>
                    `).join('');
                    
                    document.getElementById('recent-detections').innerHTML = detectionsHtml;
                } else {
                    document.getElementById('recent-detections').innerHTML = '<div class="loading">No recent detections</div>';
                }
            } catch (error) {
                document.getElementById('recent-detections').innerHTML = '<div class="error">Failed to load detections</div>';
            }
        }

        async function loadDeviceStatus() {
            try {
                const response = await fetch(`${API_BASE}/devices`);
                const data = await response.json();
                
                if (data.devices && data.devices.length > 0) {
                    const devicesHtml = data.devices.map(device => {
                        const isActive = device.status === 'active';
                        const lastSeen = device.last_seen ? new Date(device.last_seen).toLocaleString() : 'Never';
                        
                        return `
                            <div class="stat">
                                <div class="device-status">
                                    <span class="status-indicator ${isActive ? 'status-active' : 'status-inactive'}"></span>
                                    <span class="stat-label">${device.name}</span>
                                </div>
                                <span class="stat-value">${lastSeen}</span>
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('device-status').innerHTML = devicesHtml;
                } else {
                    document.getElementById('device-status').innerHTML = '<div class="loading">No devices found</div>';
                }
            } catch (error) {
                document.getElementById('device-status').innerHTML = '<div class="error">Failed to load device status</div>';
            }
        }

        async function loadSpeciesStats() {
            try {
                const response = await fetch(`${API_BASE}/stats/detections?days=7`);
                const data = await response.json();
                
                if (data.species_counts) {
                    const speciesHtml = Object.entries(data.species_counts)
                        .sort(([,a], [,b]) => b - a)
                        .map(([species, count]) => `
                            <div class="stat">
                                <span class="stat-label">${species}</span>
                                <span class="stat-value">${count}</span>
                            </div>
                        `).join('');
                    
                    document.getElementById('species-stats').innerHTML = speciesHtml;
                } else {
                    document.getElementById('species-stats').innerHTML = '<div class="loading">No species data available</div>';
                }
            } catch (error) {
                document.getElementById('species-stats').innerHTML = '<div class="error">Failed to load species stats</div>';
            }
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
            
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        function exportData() {
            alert('Export functionality would be implemented here');
        }

        function viewLogs() {
            alert('Log viewer would be implemented here');
        }

        function systemHealth() {
            alert('System health check would be implemented here');
        }

        // Auto-refresh every 30 seconds
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
